<!DOCTYPE html?>
<head>
  <title>John Vidulich's Portfolio</title>
  <meta charset = "UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .chart-container{
      width:90%;
      max-width:800px;
      margin:30px auto;
    }
    .image img {
      width: 300px;
      height: 300px;
      object-fit: cover;
    }
    body { 
      font-family: "Courier New"; 
      color: black;
      background-color: #E3DCDC;
      font-size: 18px; 
      margin: 25px;
    }
    header {
      background-color: #E3DCDC;
      padding: 10px; 
      text-align: center;
      border-bottom: 3px solid #FF0145;
    }
    h1 {
      font-family: "Courier New";
      font-size: 48px;
      margin:25px;
    }
    p {
      margin: 25px;
      padding: 10px;
    }

    .image img {
      margin: 10px;
      border-radius: 25px;
    }
  </style>
</head>
<body>
  <header>
    <a href="#about"><span style="color:#FF0145;">About Me</span></a>
  </header>
  <h1 style="text-align:center;">My Online Portfolio</h1>
  <p style="text-align:center;">Im John Vidulich and welcome to my personal portfolio website.</p>
  <div style="text-align:center;" class="image"> 
    <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRH5c2i7D8Mao4q4faPorxfiOtQOa2T9F5cqQC6MHIi0g&s=10">
  <br>
    <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ5ihZqFGk3-NzMwOBDEA2WSfgy6pOol1-UbJ7NOJXZeA&s=10">
  </div>
  <div class = "chart-container">
    <canvas id = "chart"></canvas>
  </div>
  <div class="chart-container">
    <canvas id="barChart"></canvas>
  </div>
  <section id="about">
    <h2 style="text-align:center;">About Me</h2>
    <p style="text-align:center;">I am a Economics student with a minor in Digital and Data Studies with interests in a wealth management career.</p>
  </section>
  <script>
    const ctx = document.getElementById("chart");
    new Chart(ctx,{
      type:"line", 
      data: {
        labels:["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        datasets:[{
          label: "Time Spent In The Library a Week",
          data: [1.5, 4.5, 4.5, 8, 10],
          borderColor: "#FF0145",
          backgroundColor:"#E3DCDC",
          borderWidth:3,
          fill:true,
          tension:0.35,
          pointRadius: 4,
          pointBackgroundColor: "#FF0145"
        }]
      },
      options:{
        responsive: true
      }
    });
     const ctx2 = document.getElementById("barChart");
    new Chart(ctx2, {
      type:"bar", 
      data: {
        labels:["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        datasets:[{
          label: "Daily Calorie Consumption",
          data: [1500, 2100, 2100, 1900, 2600],
          borderColor: "#FF0145",
          backgroundColor:"#FF0145",
          borderWidth:0
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>
</body>
</html>
